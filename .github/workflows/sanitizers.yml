name: Sanitizers

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  asan:
    name: Run Tests with ASAN
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ g++, clang++ ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install -y ${{ matrix.compiler }} cmake ninja-build

      - name: Configure with AddressSanitizer
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DWITH_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run tests with ASAN
        run: ctest --test-dir build --verbose
        env:
          ASAN_OPTIONS: "halt_on_error=1:strict_string_checks=1"

  ubsan:
    name: Run Tests with UBSAN
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ g++, clang++ ]
    steps:
      - name: Checkout repository
      - uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get install -y ${{ matrix.compiler }} cmake ninja-build

      - name: Configure with UBSAN
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer -g" \
            -DWITH_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run tests with UBSAN
        run: ctest --test-dir build --verbose
        env:
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

