name: Clang-Tidy Analysis

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install -y cmake ninja-build clang-tidy

      - name: Configure with clang-tidy
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_TESTS=ON

      - name: Create clang-tidy report
        run: cmake --build build --target libarcstk_clang-tidy-workflow

